services:
  ddgs-api:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - DDGS_PROXY
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://${APP_HOST:-localhost}:${APP_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
